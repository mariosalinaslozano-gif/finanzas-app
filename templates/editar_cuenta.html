{% extends "base.html" %}

{% block contenido %}
<h2>{% if cuenta.id %}Editar cuenta{% else %}Nueva cuenta{% endif %}</h2><form method="POST" action="{{ url_for('editar_cuenta', id=cuenta.id) if cuenta.id else url_for('nueva_cuenta') }}">
{% if error %}<p>{{ error }}</p>{% endif %}
    
    <label>Nombre <input type="text" name="nombre" value="{{ cuenta.nombre  or ''}}" required></label>

    <label>Type
    <select name="tipo">
        <option value="debito" {% if cuenta.tipo == "debito" %}selected{% endif %}>Debit</option>
        <option value="credito" {% if cuenta.tipo == "credito" %}selected{% endif %}>Credit</option>
    </select></label>

    <label>Cut-off day
    <input type="number" name="dia_corte" min="1" max="31" value="{{ cuenta.dia_corte or '' }}">
    </label>

    <label>
    Saldo Inicial <input required type="number" step="0.01" name="saldo_inicial" value="{{ cuenta.saldo_inicial if cuenta.saldo_inicial is not none else '' }}">
    </label>

    <label>Currency
    <select name="moneda" required>
        <option value="USD" {% if cuenta.moneda == "USD" %}selected{% endif %}>USD</option>
        <option value="MXN" {% if cuenta.moneda == "MXN" %}selected{% endif %}>MXN</option>
    </select>
    </label>

    <label>Payment day
    <input type="number" name="dia_pago" min="1" max="31" value="{{ cuenta.dia_pago or '' }}">
    </label>

    <label>Credit limit
    <input type="number" step="0.01" name="limite_credito" value="{{ cuenta.limite_credito or '' }}">
    </label>

    <button type="submit">Guardar cambios</button>
</form>
{% if cuenta.id %}
<form method="POST" action={{ url_for('borrar_cuenta', id=cuenta.id) }}>
    <button type="submit" class="secondary">Borrar</button>
</form>
{% endif %}

{% endblock %}
